name: Stock Data Downloader (Ashare Version)

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: '股票代码 (纯数字，如 600900 或 000001)'
        required: true
        default: '600900'
      period:
        description: '颗粒度 (1d=日线, 1m/5m/15m/30m/60m=分钟线)'
        required: true
        default: '1d'
      start_date:
        description: '数据开始日期 (YYYY-MM-DD)'
        required: true
        default: '2025-01-01'
      count:
        description: '最大抓取条数 (默认1000条)'
        required: true
        default: '6000'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Run Ashare Fetcher
        run: |
          python main.py \
            --symbol ${{ github.event.inputs.symbol }} \
            --period ${{ github.event.inputs.period }} \
            --start ${{ github.event.inputs.start_date }} \
            --count ${{ github.event.inputs.count }}

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: stock-data-${{ github.event.inputs.symbol }}-${{ github.event.inputs.period }}
          path: "*.csv"
          retention-days: 7
