name: Stock Data Downloader (Ashare Loop Version)

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: '股票代码 (如 600900)'
        required: true
        default: '600900'
      period:
        description: '周期 (1m, 5m, 15m, 30m, 60m)'
        required: true
        default: '1m'
      start_date:
        description: '开始日期 (YYYY-MM-DD)'
        required: true
        default: '2025-01-01'
      count:
        description: '抓取深度 (1m建议填2000，腾讯接口上限约在此范围)'
        required: true
        default: '2000'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 强制使用 Node 24 消除之前的警告
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Run Fetcher
        run: |
          # 注意：这里的参数名必须和 main.py 中的 argparse 对应
          python main.py \
            --symbol "${{ github.event.inputs.symbol }}" \
            --period "${{ github.event.inputs.period }}" \
            --start "${{ github.event.inputs.start_date }}" \
            --count "${{ github.event.inputs.count }}"

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: stock-${{ github.event.inputs.symbol }}-${{ github.event.inputs.period }}
          path: "*.csv"
          retention-days: 7
